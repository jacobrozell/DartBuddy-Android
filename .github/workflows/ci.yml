name: CI

on:
  push:
    branches: [main, master, 'release/**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  firebase-parity:
    name: Firebase iOS/Android parity
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Android
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Checkout iOS
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: jacobrozell/Dart-Buddy
          path: DartBuddy

      - name: Verify Firebase telemetry parity
        run: ./scripts/check-firebase-parity.sh

  build-test:
    name: Gradle assembleDebug + test
    needs: firebase-parity
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK 17
        uses: actions/setup-java@3b6f435528c19b13a4bb13d28c493fdeecf6289f # v5.0.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Firebase config (CI placeholder)
        run: |
          if [ ! -f app/google-services.json ]; then
            cp app/google-services.json.example app/google-services.json
          fi

      - name: Build and test
        run: ./gradlew assembleDebug test --no-daemon
